<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#263c58"><title>위키드 게임</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#28394f}body{display:grid;place-items:center;font-family:system-ui,-apple-system,sans-serif}.scene{position:relative;width:min(100vw,56.2799dvh);aspect-ratio:941/1672;overflow:hidden;isolation:isolate;background:#66ade9;container-type:inline-size}.screen{position:absolute;inset:0;background-position:center;background-size:100% 100%;background-repeat:no-repeat}.screen[hidden],.result[hidden]{display:none}.intro{background-image:url('assets/intro.png')}.selection{background-image:url('assets/target-screen.png')}.game{background-image:url('assets/castle.png')}.start{position:absolute;left:27%;top:31%;width:46%;height:9%;border:0;background:transparent;cursor:pointer;touch-action:manipulation}.start:focus-visible{outline:3px solid #fff;border-radius:40px}.slot-face{position:absolute;left:33%;top:45.1%;width:34%;height:18.4%;overflow:hidden;border-radius:8%;background:#fff2f8;display:grid;place-items:start center;box-shadow:0 0 8px 4px #fff4}.slot-face img{width:74%;height:auto;display:block;filter:drop-shadow(0 2px 3px #63506466)}.slot-face.spinning img{animation:spinTick .12s ease-out}@keyframes spinTick{from{opacity:.25;transform:translateY(-8%)}to{opacity:1;transform:translateY(0)}}
.window{position:absolute;overflow:hidden;border-radius:48% 48% 0 0 / 42% 42% 0 0;pointer-events:none}.window.ready{pointer-events:auto;cursor:crosshair;touch-action:manipulation}.sprite{position:absolute;width:76%;height:auto;left:50%;top:16%;transform:translate(-50%,115%);display:block;pointer-events:none;will-change:transform;transition:transform 420ms cubic-bezier(.22,.82,.26,1)}.window.up .sprite{transform:translate(-50%,0)}.window.down .sprite{transition-duration:440ms;transition-timing-function:cubic-bezier(.55,0,.78,.2)}
.touch-feedback{position:absolute;z-index:3;transform:translate(-50%,-110%);padding:.18em .45em;border-radius:999px;background:#17324de8;color:#fff;font-size:clamp(14px,4.5cqw,26px);font-weight:900;white-space:nowrap;text-shadow:0 1px 2px #17324d;pointer-events:none}.touch-feedback[hidden]{display:none}.touch-feedback.correct{background:#df4d9a}.touch-feedback.wrong{background:#263c58}
.hud{position:absolute;z-index:2;top:1.6%;left:3.2%;right:3.2%;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;color:white;font:900 5.3cqw/1.1 system-ui,-apple-system,sans-serif;text-shadow:-1px -1px 2px #183851,1px 2px 2px #183851,0 0 3px #183851;pointer-events:none;font-variant-numeric:tabular-nums}.hud span:nth-child(2){text-align:center}.hud span:nth-child(3){text-align:right}.hud .heart{color:#f46682;-webkit-text-stroke:1px #153855;letter-spacing:.05em}.hud .heart.lost{opacity:.26;filter:grayscale(1)}
.result{position:absolute;z-index:4;inset:0;display:block;background:#66ade9 url('assets/result-screen-clean.png') center/100% 100% no-repeat;color:#252239;text-align:center}.result-board{position:absolute;inset:0}.result-value{position:absolute;display:grid;place-items:center;border-radius:50%;font-weight:1000;line-height:1;white-space:nowrap;pointer-events:none}.score-value{left:28%;top:45.6%;width:44%;height:7.6%;color:#f05493;font-size:clamp(2rem,9cqw,5.2rem);-webkit-text-stroke:.42cqw #18233b;text-shadow:0 0 .45cqw #fff,0 .35cqw .4cqw #a9436d}.small-value{left:58.5%;width:15.5%;height:4.9%;font-size:clamp(1.1rem,4.6cqw,2.8rem);-webkit-text-stroke:.23cqw #18233b;text-shadow:0 0 .3cqw #fff}.hit-value{top:56.3%;color:#18233b}.miss-value{top:61.5%;color:#18233b}.result-action{position:absolute;top:67.7%;height:8.3%;border:0;background:transparent;cursor:pointer;touch-action:manipulation}.capture-action{left:13.5%;width:36%}.retry-action{left:50.5%;width:37%}.result-action:focus-visible{outline:3px solid white;border-radius:999px}
@media(prefers-reduced-motion:reduce){.sprite,.window.down .sprite{transition-duration:1ms}.slot-face.spinning img{animation:none}}
</style></head><body><main class="scene" aria-label="위키드 게임"><section class="screen intro" id="intro" aria-label="인트로"><button class="start" id="start" type="button" aria-label="게임 시작"></button></section><section class="screen selection" id="selection" aria-label="큐피드 타깃 선정" hidden><div class="slot-face" id="slot-face"><img id="slot-image" alt="선정 중"></div></section><section class="screen game" id="game" aria-label="성 창문에서 정답 찾기" hidden><div class="hud" aria-live="polite"><span id="hearts" aria-label="체력 3"></span><span id="timer">1:00</span><span id="score">0</span></div><div class="touch-feedback" id="touch-feedback" aria-live="polite" hidden></div><div class="result" id="result" hidden><div class="result-board" aria-label="게임 결과"><span class="result-value score-value" id="result-score">0</span><span class="result-value small-value hit-value" id="result-hit">0</span><span class="result-value small-value miss-value" id="result-miss">0</span><button class="result-action capture-action" id="capture-result" type="button" aria-label="결과 캡처"></button><button class="result-action retry-action" id="retry" type="button" aria-label="다시 시작"></button></div></div></section></main><script>
(()=>{'use strict';
const baseW=941,baseH=1672;
const windows=[[423,385,120,127],[101,591,116,125],[416,675,128,137],[738,659,126,127],[95,824,137,140],[728,867,141,150],[91,1269,147,139],[721,1283,148,144]];
const members=[['시안','assets/sian-front.png'],['로아','assets/roa-front.png'],['소이','assets/soee-front.png'],['다온','assets/daon-front.png'],['채나','assets/chaena-front.png'],['서유','assets/seoyu-front.png']];
const decoys=['assets/gpt-manager-front.png','assets/yoko-front.png','assets/runway-front.png'];
const characters=[...members.map(member=>member[1]),...decoys];
const intro=document.getElementById('intro'),selection=document.getElementById('selection'),game=document.getElementById('game'),slotFace=document.getElementById('slot-face'),slotImage=document.getElementById('slot-image'),result=document.getElementById('result'),touchFeedback=document.getElementById('touch-feedback'),resultScore=document.getElementById('result-score'),resultHit=document.getElementById('result-hit'),resultMiss=document.getElementById('result-miss'),heartsEl=document.getElementById('hearts'),timerEl=document.getElementById('timer'),scoreEl=document.getElementById('score');
const slots=windows.map(([x,y,w,h],i)=>{const el=document.createElement('div');el.className='window';el.dataset.slot=String(i+1);Object.assign(el.style,{left:`${x/baseW*100}%`,top:`${y/baseH*100}%`,width:`${w/baseW*100}%`,height:`${h/baseH*100}%`});const img=document.createElement('img');img.className='sprite';img.alt='';el.append(img);game.append(el);return el});
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const screenReady=Promise.all(['assets/target-screen.png','assets/castle.png'].map(src=>{const img=new Image();img.src=src;return img.decode().catch(()=>{})}));
const characterReady=new Map(characters.map(src=>{const img=new Image();img.src=src;return[src,img.decode().catch(()=>{})]}));
let target,started=false,running=false,health=3,score=0,hits=0,misses=0,seconds=60,deadline=0,timerId=0,waveToken=0,activeSetResolve=null,feedbackTimer=0;
function updateHud(){heartsEl.innerHTML=Array.from({length:3},(_,i)=>`<span class="heart${i<health?'':' lost'}">♥</span>`).join('');heartsEl.setAttribute('aria-label',`체력 ${health}`);timerEl.textContent=`${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`;scoreEl.textContent=score.toLocaleString('ko-KR')}
function clearWindows(){slots.forEach(slot=>{slot.classList.remove('ready','up');slot.classList.add('down');slot.dataset.role=''})}
function showTouchFeedback(slot,text,type,duration){const rect=slot.getBoundingClientRect(),area=game.getBoundingClientRect();touchFeedback.textContent=text;touchFeedback.className=`touch-feedback ${type}`;touchFeedback.style.left=`${(rect.left+rect.width/2-area.left)/area.width*100}%`;touchFeedback.style.top=`${(rect.top+rect.height*.18-area.top)/area.height*100}%`;touchFeedback.hidden=false;clearTimeout(feedbackTimer);feedbackTimer=setTimeout(()=>{touchFeedback.hidden=true},duration)}
function vibrate(pattern){try{if(typeof navigator!=='undefined'&&typeof navigator.vibrate==='function')navigator.vibrate(pattern)}catch{}}
let audioContext=null;function playSfx(kind){try{const AudioContextClass=window.AudioContext||window.webkitAudioContext;if(!AudioContextClass)return;if(!audioContext)audioContext=new AudioContextClass();const ctx=audioContext;if(ctx.state==='suspended')ctx.resume();const spec=kind==='ui'?{type:'triangle',start:120,end:68,duration:.105,level:.035}:kind==='correct'?{type:'triangle',start:650,end:280,duration:.23,level:.045}:{type:'square',start:170,end:135,duration:.14,level:.024};const now=ctx.currentTime,osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=spec.type;osc.frequency.setValueAtTime(spec.start,now);if(kind==='correct'){osc.frequency.exponentialRampToValueAtTime(310,now+.08);osc.frequency.exponentialRampToValueAtTime(510,now+.14);osc.frequency.exponentialRampToValueAtTime(spec.end,now+spec.duration)}else osc.frequency.exponentialRampToValueAtTime(spec.end,now+spec.duration);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(spec.level,now+.012);gain.gain.exponentialRampToValueAtTime(.0001,now+spec.duration);osc.connect(gain);gain.connect(ctx.destination);osc.start(now);osc.stop(now+spec.duration+.01)}catch{}}
async function waitForNextSet(){let remaining=1300+Math.random()*500;while(remaining>0){const untilHalf=deadline-Date.now()-30000;if(untilHalf<=0){await delay(remaining*.5);return}if(remaining<=untilHalf){await delay(remaining);return}await delay(untilHalf);remaining-=untilHalf}}
function finish(){if(!running)return;running=false;waveToken++;clearInterval(timerId);clearWindows();resultScore.textContent=score.toLocaleString('ko-KR');resultHit.textContent=hits.toLocaleString('ko-KR');resultMiss.textContent=misses.toLocaleString('ko-KR');result.hidden=false}
function tick(){if(!running)return;seconds=Math.max(0,Math.ceil((deadline-Date.now())/1000));updateHud();if(seconds===0)finish()}
async function wave(token){await delay(650);while(running&&token===waveToken){const decoysForSet=shuffle([...new Set(characters.filter(src=>src!==target))]).slice(0,4);const chosen=shuffle([target,...decoysForSet]);await Promise.all(chosen.map(src=>characterReady.get(src)));if(!running||token!==waveToken)break;const chosenSlots=shuffle([...slots]).slice(0,5);chosenSlots.forEach((slot,i)=>{slot.classList.remove('ready','up');slot.classList.add('down');slot.querySelector('img').src=chosen[i];slot.dataset.character=chosen[i];slot.dataset.role=chosen[i]===target?'target':'decoy'});await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));if(!running||token!==waveToken)break;chosenSlots.forEach(slot=>{slot.classList.remove('down');slot.classList.add('up')});await delay(420);if(!running||token!==waveToken)break;chosenSlots.forEach(slot=>slot.classList.add('ready'));const result=await new Promise(resolve=>{activeSetResolve=resolve;setTimeout(()=>resolve(false),800)});activeSetResolve=null;if(!running||token!==waveToken)break;if(result){await delay(440);if(!running||token!==waveToken)break;clearWindows()}else{chosenSlots.forEach(slot=>{slot.classList.remove('ready','up');slot.classList.add('down');slot.dataset.role='';slot.dataset.character=''});await waitForNextSet()}}}
slots.forEach(slot=>slot.addEventListener('pointerdown',e=>{if(!running||!slot.classList.contains('ready'))return;e.preventDefault();slot.classList.remove('ready');if(slot.dataset.character===target){score+=100;hits++;showTouchFeedback(slot,'정답 +100','correct',750);vibrate([24,35,24]);playSfx('correct');slots.forEach(active=>{if(active.dataset.role){active.classList.remove('ready','up');active.classList.add('down')}});if(activeSetResolve)activeSetResolve(true)}else{health--;misses++;showTouchFeedback(slot,'오답','wrong',700);vibrate(70);playSfx('wrong')}updateHud();if(health<=0)finish()}));
function beginGame(){health=3;score=0;hits=0;misses=0;seconds=60;updateHud();result.hidden=true;selection.hidden=true;game.hidden=false;running=true;deadline=Date.now()+60000;clearInterval(timerId);timerId=setInterval(tick,100);wave(++waveToken)}
async function choose(){if(started)return;started=true;target=members[Math.floor(Math.random()*members.length)][1];await screenReady;intro.hidden=true;selection.hidden=false;const sequence=shuffle([...members]);let index=0;for(let i=0;i<20;i++){const member=sequence[index++%sequence.length];slotImage.src=member[1];slotImage.alt=`타깃 선정 중: ${member[0]}`;slotFace.classList.remove('spinning');void slotFace.offsetWidth;slotFace.classList.add('spinning');await delay(75+Math.max(0,i-11)*25)}slotFace.classList.remove('spinning');slotImage.src=target;slotImage.alt=`선정된 타깃: ${members.find(member=>member[1]===target)[0]}`;await delay(1800);beginGame()}

async function captureResult(){const image=new Image();image.src='assets/result-screen-clean.png';await image.decode();const canvas=document.createElement('canvas');canvas.width=image.naturalWidth;canvas.height=image.naturalHeight;const ctx=canvas.getContext('2d');ctx.drawImage(image,0,0);function drawValue(value,x,y,size,color,stroke){ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`1000 ${size}px system-ui, sans-serif`;ctx.lineJoin='round';ctx.lineWidth=size*.18;ctx.strokeStyle='#fff';ctx.strokeText(value,x,y);ctx.lineWidth=size*.1;ctx.strokeStyle='#18233b';ctx.strokeText(value,x,y);ctx.fillStyle=color;ctx.fillText(value,x,y)}drawValue(resultScore.textContent,canvas.width*.5,canvas.height*.494,canvas.width*.09,'#f05493','#18233b');drawValue(resultHit.textContent,canvas.width*.6625,canvas.height*.5875,canvas.width*.046,'#18233b','#18233b');drawValue(resultMiss.textContent,canvas.width*.6625,canvas.height*.6395,canvas.width*.046,'#18233b','#18233b');const link=document.createElement('a');link.download='wicked-game-result.png';link.href=canvas.toDataURL('image/png');link.click()}
document.getElementById('capture-result').addEventListener('click',()=>{vibrate(12);playSfx('ui');captureResult()});
document.getElementById('start').addEventListener('click',()=>{vibrate(12);playSfx('ui');choose()});
document.getElementById('retry').addEventListener('click',()=>{vibrate(12);playSfx('ui');running=false;waveToken++;clearInterval(timerId);clearWindows();game.hidden=true;selection.hidden=true;intro.hidden=false;started=false});
updateHud();
})();
</script></body></html>
